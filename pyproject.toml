[project]
name = "znacht-workspace"
version = "0.0.0"
description = "Workspace root for Znacht (not a package)"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
znacht = { workspace = true }
znacht-memory = { workspace = true }
znacht-cookidoo = { workspace = true }
znacht-migros = { workspace = true }
znacht-llm-anthropic = { workspace = true }
znacht-engine = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "hypothesis>=6.115",
  "mypy>=1.13",
  "ruff>=0.8",
  "types-PyYAML>=6.0",
  "vcrpy>=6.0",
  "python-dotenv>=1.0",
  "znacht",
  "znacht-memory",
  "znacht-cookidoo",
  "znacht-migros",
  "znacht-llm-anthropic",
  "znacht-engine",
  "respx>=0.21",
  "httpx>=0.27",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/znacht/src", "packages/znacht-memory/src", "packages/znacht-cookidoo/src", "packages/znacht-migros/src", "packages/znacht-llm-anthropic/src", "packages/znacht-engine/src", "tests"]

[tool.ruff.lint]
allowed-confusables = ["–", "×"]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "ASYNC"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
"packages/znacht-engine/src/znacht_engine/app.py" = ["B008"]
"custom_components/**" = ["ANN"]
"tests_ha/**" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "packages/znacht/src:packages/znacht-memory/src:packages/znacht-cookidoo/src:packages/znacht-migros/src:packages/znacht-llm-anthropic/src:packages/znacht-engine/src"
packages = ["znacht", "znacht_memory", "znacht_cookidoo", "znacht_migros", "znacht_llm_anthropic", "znacht_engine"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
