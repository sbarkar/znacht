plan_week:
  name: Plan week
  description: Ask the engine to plan a week. Nothing is written to Cookidoo or the store until apply_plan.
  fields:
    week:
      name: Week
      description: Monday of the week (YYYY-MM-DD). Defaults to next Monday.
      example: "2026-10-26"
      selector:
        date:
optimize_products:
  name: Optimise products
  description: Re-run the split and the health-first product optimisation.
apply_plan:
  name: Apply plan
  description: Write the approved plan to My Week and the lists. The only service that writes to external systems.
  fields:
    run_id:
      name: Run
      description: The run to apply. Defaults to the latest.
      selector:
        number:
          min: 1
          mode: box
update_pantry:
  name: Update pantry
  description: Set pantry quantities. Use "0" to remove an item.
  fields:
    items:
      name: Items
      description: Mapping of ingredient to quantity, e.g. {"rice": "1 kg", "olive oil": "0"}.
      required: true
      selector:
        object:
reconcile:
  name: Reconcile
  description: >-
    Check both lists together against the week's needs: surplus beyond one pack, the same product
    on both lists, and lines no recipe asked for. Approve waits until each finding is fixed or
    overridden with a reason. On a sent plan it checks the store's live lists. Returns the findings.
  fields:
    run_id:
      name: Run
      description: The run to check. Defaults to the latest.
      selector:
        number:
          min: 1
          mode: box
    fix:
      name: Fix
      description: Finding IDs to fix; their quantities are computed again from the week's need.
      example: '["surplus:carrots"]'
      selector:
        object:
    overrides:
      name: Overrides
      description: Finding ID to the reason you buy it anyway. Logged with the run.
      example: '{"surplus:carrots": "carrot cake for the school fair"}'
      selector:
        object:
refresh:
  name: Refresh
  description: Re-read the store lists.
mark_ordered:
  name: Mark ordered
  description: Record that you placed the Migros order for a sent plan. Znacht then leaves the days it covers alone. Writes only to Znacht; it never orders anything itself.
  fields:
    run_id:
      name: Run
      description: The sent run the order is for. Defaults to the latest.
      selector:
        number:
          min: 1
          mode: box
    dates:
      name: Days
      description: The days the order covers. Defaults to the dinners after the delivery day.
      example: '["2026-10-27", "2026-10-28"]'
      selector:
        object:
