[project]
name = "znacht"
version = "0.1.0.dev0"
description = "Znacht: weekly meal planning, grocery splitting and product optimisation for households. Core domain and ports."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{ name = "Sergej Barkar" }]
keywords = ["meal-planning", "groceries", "home-assistant", "thermomix", "cookidoo", "migros"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3.12",
  "Topic :: Home Automation",
]
dependencies = [
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "typer>=0.12",
  "httpx>=0.27",
]

[project.optional-dependencies]
testing = ["pytest>=8.3"]

[project.scripts]
znacht = "znacht.cli:app"

[project.entry-points."znacht.planner_providers"]
rule_based = "znacht.planner.rule_based:RuleBasedPlanner"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/znacht"]
