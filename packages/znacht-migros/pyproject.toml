[project]
name = "znacht-migros"
version = "0.1.0.dev0"
description = "Migros (Switzerland) grocery store adapter for Znacht: catalogue, dual-channel prices, lists by ID. Never checks out."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["znacht", "httpx>=0.27"]

[project.entry-points."znacht.grocery_stores"]
migros = "znacht_migros.store:MigrosGroceryStore"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/znacht_migros"]
