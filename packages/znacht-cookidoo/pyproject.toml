[project]
name = "znacht-cookidoo"
version = "0.1.0.dev0"
description = "Cookidoo adapter for Znacht: recipe source and My Week meal-plan sink, built on cookidoo-api."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "znacht",
  "cookidoo-api>=0.19,<0.20",
  "aiohttp>=3.10",
]

[project.entry-points."znacht.recipe_sources"]
cookidoo = "znacht_cookidoo.recipes:CookidooRecipeSource"

[project.entry-points."znacht.meal_plan_sinks"]
cookidoo = "znacht_cookidoo.sink:CookidooMealPlanSink"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/znacht_cookidoo"]
