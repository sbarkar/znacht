[project]
name = "znacht-engine"
version = "0.1.0.dev0"
description = "Znacht engine: the FastAPI service that runs the weekly loop, serves the Znacht Brief, and talks to Home Assistant."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "znacht",
  "znacht-memory",
  "znacht-cookidoo",
  "znacht-migros",
  "znacht-llm-anthropic",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "ruamel-yaml>=0.18",
  "python-multipart>=0.0.9",
]

[project.scripts]
znacht-engine = "znacht_engine.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/znacht_engine"]
